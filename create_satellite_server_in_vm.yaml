---
- name: Discover and Ensure Satellite VM is Running
  hosts: kvm_hosts
  gather_facts: true
  vars_files:
    - vault.yaml

  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Ensure Satellite VM is powered on
      ansible.builtin.command: "virsh start {{ vm_name | default('satellite-server') }}"
      register: virsh_start
      failed_when: false
      changed_when: virsh_start.rc == 0

    - name: Retrieve VM IP address from libvirt (retries until booted)
      ansible.builtin.command: "virsh domifaddr {{ vm_name | default('satellite-server') }}"
      register: vm_dhcp
      until: "'ipv4' in vm_dhcp.stdout"
      retries: 30
      delay: 5
      changed_when: false

    - name: Extract dynamic IPv4 address
      ansible.builtin.set_fact:
        vm_ip: "{{ vm_dhcp.stdout | regex_search('([0-9]{1,3}\\.){3}[0-9]{1,3}') }}"

    - name: Wait for SSH port 22 to accept connections
      ansible.builtin.wait_for:
        host: "{{ vm_ip }}"
        port: 22
        state: started
        timeout: 300

    - name: Register VM in dynamic inventory using vm_ip
      ansible.builtin.add_host:
        name: "{{ vm_name | default('satellite-server') }}"
        groups: dynamic_satellite
        ansible_host: "{{ vm_ip }}"
        ansible_user: root
        ansible_ssh_private_key_file: "/home/wrenk/.ssh/hetzner_key"
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o ProxyCommand="ssh -i /home/wrenk/.ssh/hetzner_key -o StrictHostKeyChecking=no -W %h:%p root@{{ ansible_host }}"

- name: Execute Hello World and Install Satellite VM
  hosts: satellite-server
  gather_facts: true
  vars_files:
    - vault.yaml

  vars:
    ansible_python_interpreter: /usr/bin/python3

  module_defaults:
    group/theforeman.foreman.foreman:
      server_url: "https://satellite-server.lab.local"
      username: "{{ satellite_username }}"
      password: "{{ satellite_password }}"
      validate_certs: false

  tasks:
    - name: Test SSH connectivity
      ansible.builtin.ping:

    - name: Print FQDN from inside the VM
      ansible.builtin.command: hostname -f
      register: vm_fqdn
      changed_when: false

    - name: Display Hello World message
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "HELLO WORLD from inside the Satellite VM!"
          - "Target Hostname : {{ vm_fqdn.stdout }}"
          - "Target IP       : {{ ansible_host }}"
          - "Kernel Version  : {{ ansible_kernel }}"
          - "OS Distribution : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "=========================================================="

    - name: Register system with Red Hat Subscription Manager
      community.general.redhat_subscription:
        state: present
        activationkey: "{{ rh_activation_key }}"
        org_id: "{{ rh_org_id }}"

    - name: Disable all default repositories
      ansible.builtin.command: subscription-manager repos --disable="*"
      changed_when: false

    - name: Enable required Red Hat repositories
      community.general.rhsm_repository:
        name: "{{ satellite_repos }}"
        state: enabled
      changed_when: false

    - name: Install Satellite RPM package
      ansible.builtin.dnf:
        name: satellite
        state: present
      async: 3600
      poll: 0
      register: satellite_install_job

    - name: Wait for Satellite package installation to finish
      ansible.builtin.async_status:
        jid: "{{ satellite_install_job.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: 120
      delay: 30

    - name: Set system hostname
      ansible.builtin.hostname:
        name: satellite-server.lab.local

    - name: Ensure local FQDN resolves in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^({{ ansible_host }}|127\.0\.1\.1)\s+.*'
        line: "{{ ansible_host }} satellite-server.lab.local satellite-server"
        state: present
        backup: true

    - name: Clean loopback entry of FQDN to avoid installer resolution issues
      ansible.builtin.replace:
        path: /etc/hosts
        regexp: '^(127\.0\.0\.1\s+)(?:satellite-server\.lab\.local\s+)?(.*)$'
        replace: '\1\2'

    - name: Allow HTTPS permanently in firewalld
      ansible.builtin.command: firewall-cmd --add-service https --permanent
      register: fw_cmd
      changed_when: "'ALREADY_ENABLED' not in fw_cmd.stderr and fw_cmd.rc == 0"

    - name: Reload firewalld to apply changes to the active session
      ansible.builtin.command: firewall-cmd --reload
      changed_when: false

    - name: Execute Satellite Installer configuration script
      ansible.builtin.command: >
        satellite-installer --scenario satellite
        --foreman-initial-organization "{{ satellite_org }}"
        --foreman-initial-location "{{ satellite_location }}"
        --foreman-initial-admin-username "{{ satellite_username }}"
        --foreman-initial-admin-password "{{ satellite_password }}"
      async: 3600
      poll: 30