tasks:
  - task_name: "Create RHEL 10 Host Group"
    file_name: "add_vmprovisionier.yaml"
    body: |
            - name: Create RHEL 10 Host Group
              theforeman.foreman.hostgroup:
                organization: "{{ satellite_org }}"
                organizations:
                  - "{{ satellite_org }}"
                locations:
                  - "{{ satellite_location }}"
                name: "RHEL10-KVM-Servers"
                architecture: "x86_64"
                domain: "lab.local"
                subnet: "libvirt-default"
                compute_resource: "Hetzner-KVM"
                compute_profile: "1-Small"
                lifecycle_environment: "Production"
                content_view: "CV_RHEL10"
                content_source: "{{ satellite_url | replace('https://', '') | replace('/', '') }}"
                root_pass: "YourSecureRootPassword123!"
                state: present
