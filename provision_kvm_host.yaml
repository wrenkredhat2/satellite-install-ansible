---
- name: Manage Satellite Server via Vaulted File
  hosts: satellite-server
  become: false
  gather_facts: false

  vars_files:
    - vault.yaml

  module_defaults:
    group/theforeman.foreman.foreman:
      server_url: "{{ satellite_url }}"
      username: "{{ satellite_username }}"
      password: "{{ satellite_password }}"
      validate_certs: "{{ satellite_validate_certs }}"

  tasks:
#   # 1. Update the Compute Resource to use SPICE (this drops the 'cirrus' requirement)
#   - name: Update Libvirt Compute Resource to use SPICE
#     theforeman.foreman.compute_resource:
#       organizations:
#         - "{{ satellite_org }}"
#       locations:
#         - "{{ satellite_location }}"
#       name: "Hetzner-KVM"
#       provider: "libvirt"
#       provider_params:
#         url: "qemu+ssh://root@136.243.44.117/system"
#         display_type: "VNC"
#       state: present

#   # 2. Apply Hardware Profile (Without the invalid video keys)
#   - name: Assign Hardware Specs to Compute Profile
#     theforeman.foreman.compute_attribute:
#       compute_profile: "1-Small"
#       compute_resource: "Hetzner-KVM"
#       vm_attrs:
#         cpus: "2"
#         memory: "4096"
#         videoType: "virtio"
#         volumes_attributes:
#           0:
#             pool_name: "images"
#             capacity: "20G"
#             format_type: "qcow2"
#         interfaces_attributes:
#           0:
#             network: "default"
#             model: "virtio"
#       state: present

    - name: Provision Single RHEL 10 VM on KVM
      theforeman.foreman.host:
        name: "kvm-node01.lab.local"
        organization: "{{ satellite_org }}"
        location: "{{ satellite_location }}"
        hostgroup: "RHEL10-KVM-Servers"
        compute_resource: "Hetzner-KVM"
        compute_profile: "1-Small"
        operatingsystem: "RedHat 10.2"
        ptable: "Kickstart default"
        kickstart_repository: "Red Hat Enterprise Linux 10 for x86_64 - BaseOS Kickstart 10.2"
        pxe_loader: "PXELinux BIOS"
        root_pass: "YourSecureRootPassword123!"
        managed: true
        build: true
        interfaces_attributes:
          - name: "kvm-node01.lab.local"
            primary: true
            provision: true
            domain: "lab.local"
            subnet: "libvirt-default"
            compute_attributes:
              type: "bridge"       # <--- Changed from network to bridge
              bridge: "virbr0"     # <--- Explicitly use the virbr0 bridge
              model: "virtio"
        state: present

    - name: Power on the VM
      theforeman.foreman.host_power:
        name: "kvm-node01.lab.local"
        state: "on"
